name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv sync --all-extras

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      # The suite writes its own .ipynb files and runs them in subprocesses, so it needs
      # no network and no notebooks on disk. The corpus numbers in docs/RESULTS.md come
      # from real repositories and are reproduced by hand, not here.
      - name: Test
        run: uv run pytest -q
